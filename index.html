<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Sample Web Page</title>
</head>
<body>

    <!-- Main Heading -->
    <h1>Welcome to My Website</h1>
    
    <!-- Subheading -->
    <h2>About This Page</h2>
    
    <!-- Paragraph text -->
    <p>This is a simple paragraph of text. HTML stands for <strong>HyperText Markup Language</strong> and is used to structure content on the web.</p>
    
    <!-- A hyperlink linking to another site -->
    <p>Learn more by visiting <a href="https://developer.mozilla.org" target="_blank">MDN Web Docs</a>.</p>

    <!-- An ordered list -->
    <h3>My Favorite Fruits</h3>
    <ul>
        <li>Apples</li>
        <li>Bananas</li>
        <li>Oranges</li>
    </ul>

    <!-- An image with alternative text -->
    <img src="https://placeholder.com" alt="Placeholder image of 150 by 150 pixels">

</body>
</html>
